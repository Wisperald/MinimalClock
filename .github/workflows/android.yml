name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK with licenses accepted; AGP downloads the
      # missing platform (API 37) and build-tools automatically.
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Print lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minimalclock-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimalclock-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
